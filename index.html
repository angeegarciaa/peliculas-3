<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Series App</title>

    <link rel="stylesheet" href="estilos.css">
</head>
<!-- Configuración PWA para Celulares -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0066ff">
<meta name="mobile-web-app-capable" content="yes">

<body>

    <header>
        <h1>Series App</h1>

        <nav>
            <a href="#">Inicio</a>
            <a href="#">Series</a>
            <a href="#">Recomendaciones</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Agregar una serie</h2>

            <form>

                <label for="titulo">Título de la serie:</label>
                <input type="text" id="titulo" name="titulo" placeholder="Ej: Stranger Things">

                <label for="genero">Género:</label>
                <select id="genero" name="genero">
                    <option value="">Seleccionar género</option>
                    <option value="accion">Acción</option>
                    <option value="comedia">Comedia</option>
                    <option value="drama">Drama</option>
                    <option value="terror">Terror</option>
                    <option value="romance">Romance</option>
                    <option value="suspenso">Suspenso</option>
                    <option value="ciencia-ficcion">Ciencia ficción</option>
                </select>

                <label for="plataforma">Plataforma:</label>
                <select id="plataforma" name="plataforma">
                    <option value="">Seleccionar plataforma</option>
                    <option value="netflix">Netflix</option>
                    <option value="disney">Disney+</option>
                    <option value="max">Max</option>
                    <option value="prime">Prime Video</option>
                    <option value="otras">Otra</option>
                </select>

                <label for="temporadas">Cantidad de temporadas:</label>
                <input type="number" id="temporadas" name="temporadas" min="1" placeholder="Ej: 4">

                <label for="puntuacion">Puntuación:</label>
                <input type="number" id="puntuacion" name="puntuacion" min="1" max="10" placeholder="1 a 10">

                <!-- Imagen -->
                <label for="imagen">Imagen de la serie:</label>
                <input type="file" id="imagen" name="imagen" accept="image/*">

                <!-- Datefile -->
                <label for="datefile">Imagen:</label>
                <input type="text" id="datefile" name="datefile" placeholder="subi la imagen">

                <label for="resena">Reseña:</label>
                <textarea id="resena" name="resena" rows="5" placeholder="Escribí una breve reseña de la serie"></textarea>

                <button type="submit">Agregar serie</button>

            </form>
        </section>

        <section>
            <h2>Recomendaciones</h2>
            <p>Acá aparecerán las series recomendadas.</p>
        </section>

    </main>

    <footer>
        <p>Series App - Recomendación de series</p>
    </footer>

</body>

</html>
